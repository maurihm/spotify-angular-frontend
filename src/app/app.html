<header>
  <h1>Spotify popularity</h1>
  <a [href]="apiUrl + '/docs'" target="_blank" rel="noopener">API docs</a>
</header>

<main>
  <section class="row">
    <label>
      Backend URL
      <input
        type="text"
        [(ngModel)]="apiUrl"
        (change)="onApiUrlChange()"
        placeholder="https://tu-servicio.onrender.com"
      />
    </label>
    <label>
      Dataset de entrenamiento
      <select [(ngModel)]="modelSize">
        <option value="25">25% (esperado 39.75)</option>
        <option value="50">50% (esperado 31.84)</option>
        <option value="100">100% (esperado 36.70)</option>
      </select>
    </label>
  </section>

  <section class="train">
    <button type="button" (click)="retrain()" [disabled]="trainStatus === 'running'">
      {{ trainStatus === 'running' ? 'Entrenando…' : 'Reentrenar modelo' }}
    </button>
    <span class="muted" [class.error]="trainStatus === 'error'">{{ trainMessage }}</span>
  </section>

  <section class="train">
    <button type="button" (click)="publishImage()">Publicar imagen (GitHub Actions)</button>
    <span class="muted" [class.error]="deployOk === false">{{ deployMessage }}</span>
  </section>

  <section>
    <h2>Presets</h2>
    <div class="presets">
      <button type="button" [class.active]="activePreset === 'default'" (click)="loadPreset('default')">Oficial</button>
      <button type="button" [class.active]="activePreset === 'hit'" (click)="loadPreset('hit')">Pop</button>
      <button type="button" [class.active]="activePreset === 'ballad'" (click)="loadPreset('ballad')">Balada</button>
      <button type="button" [class.active]="activePreset === 'rock'" (click)="loadPreset('rock')">Rock</button>
      <button type="button" [class.active]="activePreset === 'electronic'" (click)="loadPreset('electronic')">Electrónica</button>
    </div>
  </section>

  <div class="layout">
    <section>
      <h2>Características</h2>
      <div class="grid">
        <label>
          <span>Danceability <output>{{ payload.danceability }}</output></span>
          <input type="range" min="0" max="1" step="0.001" [(ngModel)]="payload.danceability" />
        </label>
        <label>
          <span>Energy <output>{{ payload.energy }}</output></span>
          <input type="range" min="0" max="1" step="0.001" [(ngModel)]="payload.energy" />
        </label>
        <label>
          <span>Loudness <output>{{ payload.loudness }} dB</output></span>
          <input type="range" min="-40" max="0" step="0.01" [(ngModel)]="payload.loudness" />
        </label>
        <label>
          <span>Valence <output>{{ payload.valence }}</output></span>
          <input type="range" min="0" max="1" step="0.001" [(ngModel)]="payload.valence" />
        </label>
        <label>
          <span>Tempo <output>{{ payload.tempo }} BPM</output></span>
          <input type="range" min="50" max="220" step="0.001" [(ngModel)]="payload.tempo" />
        </label>
        <label>
          <span>Speechiness <output>{{ payload.speechiness }}</output></span>
          <input type="range" min="0" max="1" step="0.001" [(ngModel)]="payload.speechiness" />
        </label>
        <label>
          <span>Acousticness <output>{{ payload.acousticness }}</output></span>
          <input type="range" min="0" max="1" step="0.0001" [(ngModel)]="payload.acousticness" />
        </label>
        <label>
          <span>Instrumentalness <output>{{ payload.instrumentalness }}</output></span>
          <input type="range" min="0" max="1" step="0.000001" [(ngModel)]="payload.instrumentalness" />
        </label>
        <label>
          <span>Liveness <output>{{ payload.liveness }}</output></span>
          <input type="range" min="0" max="1" step="0.001" [(ngModel)]="payload.liveness" />
        </label>
        <label>
          Duración (ms)
          <input type="number" [(ngModel)]="payload.duration_ms" step="1000" min="30000" max="900000" />
        </label>
        <label>
          Key
          <select [(ngModel)]="payload.key">
            <option [ngValue]="0">C</option>
            <option [ngValue]="1">C# / Db</option>
            <option [ngValue]="2">D</option>
            <option [ngValue]="3">D# / Eb</option>
            <option [ngValue]="4">E</option>
            <option [ngValue]="5">F</option>
            <option [ngValue]="6">F# / Gb</option>
            <option [ngValue]="7">G</option>
            <option [ngValue]="8">G# / Ab</option>
            <option [ngValue]="9">A</option>
            <option [ngValue]="10">A# / Bb</option>
            <option [ngValue]="11">B</option>
          </select>
        </label>
        <label>
          Mode
          <select [(ngModel)]="payload.mode">
            <option [ngValue]="0">Menor</option>
            <option [ngValue]="1">Mayor</option>
          </select>
        </label>
        <label>
          Compás
          <select [(ngModel)]="payload.time_signature">
            <option [ngValue]="3">3/4</option>
            <option [ngValue]="4">4/4</option>
            <option [ngValue]="5">5/4</option>
          </select>
        </label>
      </div>
    </section>

    <aside>
      <section class="result">
        <div class="score">{{ score !== null ? score : '—' }}</div>
        <p class="muted">{{ scoreSubtitle }}</p>
        <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>
        <button type="button" class="primary" (click)="predictPopularity()" [disabled]="loading">
          {{ loading ? 'Consultando…' : 'Calcular' }}
        </button>
      </section>

      <section *ngIf="history.length > 0">
        <h2>Historial</h2>
        <ul class="history">
          <li *ngFor="let item of history">
            <span>{{ item.datasetTag }}<small>{{ item.presetName }} · {{ item.timestamp }}</small></span>
            <strong>{{ item.score }}</strong>
          </li>
        </ul>
      </section>

      <section>
        <h2>
          cURL
          <button type="button" (click)="copyCurl()">{{ copied ? 'Copiado' : 'Copiar' }}</button>
        </h2>
        <pre>{{ curlCommand }}</pre>
      </section>
    </aside>
  </div>
</main>
